name: PHP CI Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Check GitHub Secret
        env:
          DEMO_SECRET: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "GitHub Secret is configured"
          else
            echo "GitHub Secret is not configured"
          fi

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run Application Tests
        run: php artisan test
